<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Participation Tracker</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
    }
    [hidden] { display: none !important; }
    .topnav {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }
    .topnav button {
      padding: 0.5rem 1rem;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .topnav button.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem; }
    .view h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .roster-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .roster-toolbar > div { display: flex; gap: 0.5rem; }
    button {
      padding: 0.45rem 0.85rem;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #f0f0f0; }
    button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    button.primary:hover { background: #333; }
    button.danger { color: #c00; border-color: #e0c0c0; }
    button.danger:hover { background: #fff0f0; }
    #student-form, #bulk-import {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    #student-form h2, #bulk-import h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
    #student-form-el {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    #student-form-el label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #555;
    }
    #student-form-el input {
      padding: 0.5rem;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }
    .form-actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; }
    #bulk-text {
      width: 100%;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      padding: 0.5rem;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    #bulk-import p.hint { margin: 0 0 0.5rem; font-size: 0.85rem; color: #666; }
    .roster-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .roster-table th, .roster-table td {
      padding: 0.6rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.95rem;
    }
    .roster-table th {
      background: #fafafa;
      font-weight: 600;
      font-size: 0.85rem;
      color: #555;
    }
    .roster-table tbody tr:last-child td { border-bottom: none; }
    .roster-table td:last-child { white-space: nowrap; }
    .empty {
      color: #777;
      text-align: center;
      padding: 2rem;
      background: #fff;
      border: 1px dashed #d0d0d0;
      border-radius: 8px;
    }
    .errors { color: #c00; margin: 0.5rem 0 0; padding-left: 1.2rem; font-size: 0.9rem; }
    .bulk-summary { margin: 0.5rem 0 0; font-size: 0.9rem; }

    /* In Class view */
    .start-session-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
    }
    .start-session-wrap button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
    }
    #session-form-el {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
      max-width: 500px;
      margin: 2rem auto 0;
    }
    #session-form-el h2 { font-size: 1.05rem; margin: 0; }
    #session-form-el label { display: flex; flex-direction: column; font-size: 0.85rem; color: #555; }
    #session-form-el input {
      padding: 0.5rem;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: #1a1a1a;
      color: #fff;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .session-date { font-size: 0.85rem; opacity: 0.75; }
    .session-topic { font-size: 1.25rem; font-weight: 600; margin-top: 0.15rem; }
    .session-header button {
      background: #fff;
      color: #1a1a1a;
      border-color: #fff;
      font-weight: 500;
    }
    .session-header button:hover { background: #e8e8e8; }
    .seating-placeholder {
      background: #fff;
      border: 1px dashed #d0d0d0;
      border-radius: 8px;
      padding: 3rem 1rem;
      text-align: center;
      color: #888;
    }
    .warning-banner {
      background: #fff8e1;
      border: 1px solid #f0d77a;
      color: #6b5a0a;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    /* Seating chart */
    .seating-grid {
      display: grid;
      gap: 0.6rem;
      grid-template-columns: repeat(var(--cols, 1), minmax(80px, 1fr));
    }
    .seat-tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.4rem;
      background: #fff;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 500;
      color: #1a1a1a;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      word-break: break-word;
      line-height: 1.15;
      transition: background-color 80ms;
    }
    .seat-tile.has-contrib {
      background: #e8f3eb;
      border-color: #b8d8be;
    }
    .seat-tile:active {
      background: #cfcfcf;
    }
    .seat-tile.has-contrib:active {
      background: #c3dcc8;
    }
    .seat-name { pointer-events: none; }
    .seat-badge {
      position: absolute;
      top: 5px;
      right: 6px;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
      box-sizing: border-box;
    }

    /* Contribution modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      box-sizing: border-box;
    }
    .modal h2 {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      text-align: center;
    }
    .quality-btn {
      display: block;
      width: 100%;
      min-height: 60px;
      margin-bottom: 0.6rem;
      padding: 0 1rem;
      border: none;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .quality-substantive { background: #3a8a4a; }
    .quality-substantive:active { background: #2e6e3b; }
    .quality-okay { background: #707070; }
    .quality-okay:active { background: #555; }
    .quality-talking { background: #c89034; }
    .quality-talking:active { background: #a8772a; }
    .note-label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin: 0.75rem 0 0.25rem;
    }
    .note-label input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0.75rem;
      height: 42px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 0.3rem;
      font-family: inherit;
    }
    .modal-cancel {
      display: block;
      margin: 0.75rem auto 0;
      background: none;
      border: none;
      color: #777;
      font-size: 0.95rem;
      text-decoration: underline;
      padding: 0.5rem 1rem;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .modal-error {
      margin-top: 0.6rem;
      color: #c00;
      font-size: 0.9rem;
      text-align: center;
    }
    .modal-subheader {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin: -0.5rem 0 0.85rem;
    }
    .note-label select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.75rem;
      height: 42px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 0.3rem;
      font-family: inherit;
      background: #fff;
    }

    /* Review view */
    .review-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    #review-session-picker {
      padding: 0.5rem 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      min-width: 280px;
      max-width: 100%;
    }
    .review-header {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
    }
    #review-date { font-size: 0.85rem; color: #666; }
    #review-topic { font-size: 1.2rem; font-weight: 600; margin: 0.1rem 0 0.4rem; }
    #review-stats { font-size: 0.9rem; color: #555; }
    .status-active {
      display: inline-block;
      background: #3a8a4a;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
      text-transform: uppercase;
    }
    .student-block {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.5rem;
    }
    .student-block.empty {
      border-style: dashed;
      border-color: #e8e8e8;
      background: #fafafa;
      padding-left: 1.6rem;
    }
    .student-block.empty .student-name {
      color: #9a9a9a;
      font-weight: 400;
      margin-bottom: 0;
    }
    .student-name { font-weight: 600; font-size: 1rem; margin-bottom: 0.35rem; }
    .contrib-count { color: #888; font-weight: 400; font-size: 0.85rem; margin-left: 0.25rem; }
    .no-contrib { color: #aaa; font-size: 0.85rem; font-style: italic; margin-top: 0.1rem; }
    .contrib-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .contrib-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      padding: 0.2rem 0;
      flex-wrap: wrap;
    }
    .contrib-time {
      color: #888;
      font-variant-numeric: tabular-nums;
      min-width: 70px;
      font-size: 0.85rem;
    }
    .quality-badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .quality-badge.quality-substantive { background: #3a8a4a; }
    .quality-badge.quality-okay { background: #707070; }
    .quality-badge.quality-talking { background: #c89034; }
    .contrib-note { color: #444; flex: 1; min-width: 0; }
    .contrib-actions { margin-left: auto; display: flex; gap: 0.4rem; }
    .link-btn {
      background: none;
      border: none;
      padding: 0.2rem 0.35rem;
      color: #555;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }
    .link-btn:hover { color: #1a1a1a; }
    .link-btn.danger { color: #c00; }
    .link-btn.danger:hover { color: #800; }
  </style>
  <script src="https://unpkg.com/dexie@3.2.7/dist/dexie.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <button data-view="roster" class="active">Roster</button>
    <button data-view="inclass">In Class</button>
    <button data-view="review">Review</button>
  </nav>

  <main>
    <section id="view-roster" class="view">
      <div class="roster-toolbar">
        <h1>Roster</h1>
        <div>
          <button id="btn-add-student" class="primary">+ Add Student</button>
          <button id="btn-bulk-import">Bulk Import</button>
        </div>
      </div>

      <div id="student-form" hidden>
        <h2 id="student-form-title">Add Student</h2>
        <form id="student-form-el">
          <label>Name
            <input name="name" required autocomplete="off">
          </label>
          <label>Computing ID
            <input name="computing_id" autocomplete="off">
          </label>
          <label>Seat Row
            <input name="seat_row" type="number" min="1" step="1" required>
          </label>
          <label>Seat Column
            <input name="seat_col" type="number" min="1" step="1" required>
          </label>
          <div class="form-actions">
            <button type="submit" class="primary">Save</button>
            <button type="button" id="student-form-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div id="bulk-import" hidden>
        <h2>Bulk Import</h2>
        <p class="hint">Paste CSV: <code>name,seat_row,seat_col,computing_id</code> (one per line; header row optional).</p>
        <textarea id="bulk-text" rows="8" placeholder="Alice Johnson,1,1,aj3cd&#10;Brian Lee,1,2,bl7xy"></textarea>
        <div class="form-actions">
          <button id="bulk-submit" class="primary">Import</button>
          <button id="bulk-cancel">Cancel</button>
        </div>
        <div id="bulk-result"></div>
      </div>

      <div id="roster-content"></div>
    </section>

    <section id="view-inclass" class="view" hidden>
      <div id="multi-active-warning" class="warning-banner" hidden>
        Note: another older session was left open. End it from the Review view.
      </div>

      <div id="no-active-session" class="start-session-wrap" hidden>
        <button id="btn-start-session" class="primary">Start New Session</button>
      </div>

      <form id="session-form-el" hidden>
        <h2>Start New Session</h2>
        <label>Topic
          <input name="topic" placeholder="e.g., Porter's Five Forces" autocomplete="off">
        </label>
        <label>Date
          <input name="date" type="date" required>
        </label>
        <div class="form-actions">
          <button type="submit" class="primary">Start Session</button>
          <button type="button" id="session-form-cancel">Cancel</button>
        </div>
      </form>

      <div id="active-session" hidden>
        <div class="session-header">
          <div>
            <div class="session-date" id="session-date"></div>
            <div class="session-topic" id="session-topic"></div>
          </div>
          <button id="btn-end-session">End Session</button>
        </div>
        <div id="seating-area"></div>
      </div>
    </section>

    <section id="view-review" class="view" hidden>
      <p id="review-empty" class="empty" hidden>No sessions yet. Start one from the In Class view.</p>

      <div id="review-toolbar" class="review-toolbar" hidden>
        <select id="review-session-picker" aria-label="Session"></select>
        <button id="btn-add-contrib" class="primary">+ Add Contribution</button>
      </div>

      <div id="review-content" hidden>
        <div class="review-header">
          <div id="review-date"></div>
          <div id="review-topic"></div>
          <div id="review-stats"></div>
        </div>
        <div id="review-student-list"></div>
      </div>
    </section>
  </main>

  <div id="contribution-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-labelledby="modal-student-name">
      <h2 id="modal-student-name"></h2>
      <button type="button" class="quality-btn quality-substantive" data-quality="Substantive">Substantive</button>
      <button type="button" class="quality-btn quality-okay" data-quality="Okay">Okay</button>
      <button type="button" class="quality-btn quality-talking" data-quality="Just talking">Just talking</button>
      <label class="note-label">Note (optional)
        <input id="modal-note" type="text" autocomplete="off">
      </label>
      <button type="button" class="modal-cancel" data-cancel>Cancel</button>
      <div id="modal-error" class="modal-error" hidden></div>
    </div>
  </div>

  <div id="edit-contrib-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog">
      <h2>Edit Contribution</h2>
      <div id="edit-contrib-student" class="modal-subheader"></div>
      <button type="button" class="quality-btn quality-substantive" data-edit-quality="Substantive">Substantive</button>
      <button type="button" class="quality-btn quality-okay" data-edit-quality="Okay">Okay</button>
      <button type="button" class="quality-btn quality-talking" data-edit-quality="Just talking">Just talking</button>
      <label class="note-label">Note (optional)
        <input id="edit-contrib-note" type="text" autocomplete="off">
      </label>
      <button type="button" class="modal-cancel" data-cancel>Cancel</button>
      <div id="edit-contrib-error" class="modal-error" hidden></div>
    </div>
  </div>

  <div id="add-contrib-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog">
      <h2>Add Contribution</h2>
      <label class="note-label">Student
        <select id="add-contrib-student"></select>
      </label>
      <button type="button" class="quality-btn quality-substantive" data-add-quality="Substantive">Substantive</button>
      <button type="button" class="quality-btn quality-okay" data-add-quality="Okay">Okay</button>
      <button type="button" class="quality-btn quality-talking" data-add-quality="Just talking">Just talking</button>
      <label class="note-label">Note (optional)
        <input id="add-contrib-note" type="text" autocomplete="off">
      </label>
      <button type="button" class="modal-cancel" data-cancel>Cancel</button>
      <div id="add-contrib-error" class="modal-error" hidden></div>
    </div>
  </div>

  <script>
    const _dexie = new Dexie('ParticipationTracker');

    _dexie.version(1).stores({
      students:      '++id, name, seat_row, seat_col, computing_id',
      sessions:      '++id, date, status',
      contributions: '++id, student_id, session_id, timestamp'
    });

    const db = {
      _dexie,

      async addStudent(data) {
        return await _dexie.students.add(data);
      },
      async updateStudent(id, data) {
        await _dexie.students.update(id, data);
        return await _dexie.students.get(id);
      },
      async deleteStudent(id) {
        await _dexie.students.delete(id);
      },
      async getAllStudents() {
        return await _dexie.students.toArray();
      },
      async getStudent(id) {
        return await _dexie.students.get(id);
      },

      async addSession(data = {}) {
        const record = {
          date: new Date().toISOString().slice(0, 10),
          status: 'active',
          ...data
        };
        return await _dexie.sessions.add(record);
      },
      async updateSession(id, data) {
        await _dexie.sessions.update(id, data);
        return await _dexie.sessions.get(id);
      },
      async deleteSession(id) {
        await _dexie.sessions.delete(id);
      },
      async getAllSessions() {
        return await _dexie.sessions.toArray();
      },
      async getActiveSessions() {
        const list = await _dexie.sessions.where('status').equals('active').toArray();
        list.sort((a, b) => {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return b.id - a.id;
        });
        return list;
      },
      async getActiveSession() {
        const list = await db.getActiveSessions();
        return list[0] ?? null;
      },
      async getSession(id) {
        return await _dexie.sessions.get(id);
      },

      async addContribution(data) {
        const record = {
          timestamp: new Date().toISOString(),
          ...data
        };
        return await _dexie.contributions.add(record);
      },
      async updateContribution(id, data) {
        await _dexie.contributions.update(id, data);
        return await _dexie.contributions.get(id);
      },
      async deleteContribution(id) {
        await _dexie.contributions.delete(id);
      },
      async getContribution(id) {
        return await _dexie.contributions.get(id);
      },
      async getContributionsBySession(sessionId) {
        return await _dexie.contributions.where('session_id').equals(sessionId).toArray();
      },
      async getContributionsByStudent(studentId) {
        return await _dexie.contributions.where('student_id').equals(studentId).toArray();
      },
      async getAllContributions() {
        return await _dexie.contributions.toArray();
      }
    };

    window.db = db;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.hidden = true);
      document.getElementById('view-' + name).hidden = false;
      document.querySelectorAll('.topnav button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === name);
      });
      if (name === 'roster') renderRoster();
      else if (name === 'inclass') renderInClass();
      else if (name === 'review') renderReview();
    }

    function formatSessionDate(isoDate) {
      if (!isoDate) return '';
      const [y, m, d] = String(isoDate).split('-').map(Number);
      if (!y || !m || !d) return isoDate;
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    async function renderInClass() {
      const activeList = await db.getActiveSessions();
      const current = activeList[0] ?? null;

      document.getElementById('multi-active-warning').hidden = activeList.length <= 1;

      const noActive = document.getElementById('no-active-session');
      const form = document.getElementById('session-form-el');
      const active = document.getElementById('active-session');

      if (current) {
        noActive.hidden = true;
        form.hidden = true;
        active.hidden = false;
        document.getElementById('session-date').textContent = formatSessionDate(current.date);
        const topic = (current.topic ?? '').trim();
        document.getElementById('session-topic').textContent = topic || 'Untitled session';
        await renderSeatingChart(current);
      } else {
        noActive.hidden = false;
        form.hidden = true;
        active.hidden = true;
        activeSessionIdForChart = null;
        document.getElementById('seating-area').innerHTML = '';
      }
    }

    document.getElementById('btn-start-session').addEventListener('click', () => {
      const form = document.getElementById('session-form-el');
      form.reset();
      form.date.value = new Date().toISOString().slice(0, 10);
      document.getElementById('no-active-session').hidden = true;
      form.hidden = false;
      form.topic.focus();
    });

    document.getElementById('session-form-cancel').addEventListener('click', () => {
      document.getElementById('session-form-el').hidden = true;
      renderInClass();
    });

    document.getElementById('session-form-el').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await db.addSession({
        topic: String(fd.get('topic') ?? '').trim(),
        date: String(fd.get('date') ?? '').trim(),
        status: 'active'
      });
      renderInClass();
    });

    document.getElementById('btn-end-session').addEventListener('click', async () => {
      const current = await db.getActiveSession();
      if (!current) { renderInClass(); return; }
      const ok = confirm("End this session? You'll still be able to review and edit contributions afterward.");
      if (!ok) return;
      await db.updateSession(current.id, { status: 'closed' });
      renderInClass();
    });

    document.querySelectorAll('.topnav button').forEach(b => {
      b.addEventListener('click', () => showView(b.dataset.view));
    });

    let editingStudentId = null;

    async function renderRoster() {
      const students = await db.getAllStudents();
      students.sort((a, b) =>
        (a.seat_row - b.seat_row) || (a.seat_col - b.seat_col)
      );
      const container = document.getElementById('roster-content');

      if (students.length === 0) {
        container.innerHTML =
          '<p class="empty">No students yet. Use Add Student or Bulk Import to get started.</p>';
        return;
      }

      const rows = students.map(s => `
        <tr>
          <td>${escapeHtml(s.name)}</td>
          <td>Row ${escapeHtml(s.seat_row)}, Col ${escapeHtml(s.seat_col)}</td>
          <td>${escapeHtml(s.computing_id)}</td>
          <td>
            <button data-action="edit" data-id="${s.id}">Edit</button>
            <button data-action="delete" data-id="${s.id}" class="danger">Delete</button>
          </td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table class="roster-table">
          <thead>
            <tr><th>Name</th><th>Seat</th><th>Computing ID</th><th>Actions</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.id);
          if (btn.dataset.action === 'edit') openEditForm(id);
          else handleDelete(id);
        });
      });
    }

    function openAddForm() {
      editingStudentId = null;
      const form = document.getElementById('student-form-el');
      form.reset();
      document.getElementById('student-form-title').textContent = 'Add Student';
      document.getElementById('student-form').hidden = false;
      document.getElementById('bulk-import').hidden = true;
      form.name.focus();
    }

    async function openEditForm(id) {
      const s = await db.getStudent(id);
      if (!s) return;
      editingStudentId = id;
      const form = document.getElementById('student-form-el');
      form.name.value = s.name ?? '';
      form.seat_row.value = s.seat_row ?? '';
      form.seat_col.value = s.seat_col ?? '';
      form.computing_id.value = s.computing_id ?? '';
      document.getElementById('student-form-title').textContent = 'Edit Student';
      document.getElementById('student-form').hidden = false;
      document.getElementById('bulk-import').hidden = true;
      form.name.focus();
    }

    document.getElementById('btn-add-student').addEventListener('click', openAddForm);
    document.getElementById('student-form-cancel').addEventListener('click', () => {
      document.getElementById('student-form').hidden = true;
    });

    document.getElementById('student-form-el').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        name: String(fd.get('name')).trim(),
        seat_row: Number(fd.get('seat_row')),
        seat_col: Number(fd.get('seat_col')),
        computing_id: String(fd.get('computing_id') ?? '').trim()
      };
      if (editingStudentId) {
        await db.updateStudent(editingStudentId, data);
      } else {
        await db.addStudent(data);
      }
      document.getElementById('student-form').hidden = true;
      renderRoster();
    });

    async function handleDelete(id) {
      const s = await db.getStudent(id);
      if (!s) return;
      const ok = confirm(`Delete ${s.name}? This will also remove their contribution history.`);
      if (!ok) return;
      await db.deleteStudent(id);
      renderRoster();
    }

    document.getElementById('btn-bulk-import').addEventListener('click', () => {
      document.getElementById('bulk-import').hidden = false;
      document.getElementById('student-form').hidden = true;
      document.getElementById('bulk-text').value = '';
      document.getElementById('bulk-result').innerHTML = '';
    });
    document.getElementById('bulk-cancel').addEventListener('click', () => {
      document.getElementById('bulk-import').hidden = true;
    });

    document.getElementById('bulk-submit').addEventListener('click', async () => {
      const text = document.getElementById('bulk-text').value;
      const resultEl = document.getElementById('bulk-result');
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      if (lines.length === 0) {
        resultEl.innerHTML = '<p class="bulk-summary">Nothing to import.</p>';
        return;
      }

      const firstCols = lines[0].split(',').map(c => c.trim().toLowerCase());
      const headerKeywords = ['name', 'seat_row', 'seat_col', 'computing_id'];
      const isHeader = firstCols.some(c => headerKeywords.includes(c));
      const dataLines = isHeader ? lines.slice(1) : lines;

      let added = 0;
      const errors = [];

      for (let i = 0; i < dataLines.length; i++) {
        const lineNum = isHeader ? i + 2 : i + 1;
        const cols = dataLines[i].split(',').map(c => c.trim());
        if (cols.length < 3) {
          errors.push(`Line ${lineNum}: expected at least 3 columns (name, seat_row, seat_col), got ${cols.length}`);
          continue;
        }
        const [name, seatRowStr, seatColStr, computingId = ''] = cols;
        const row = Number(seatRowStr);
        const col = Number(seatColStr);
        if (!name) {
          errors.push(`Line ${lineNum}: name is required`);
          continue;
        }
        if (!Number.isFinite(row) || row < 1 || !Number.isInteger(row)) {
          errors.push(`Line ${lineNum}: invalid seat_row "${seatRowStr}"`);
          continue;
        }
        if (!Number.isFinite(col) || col < 1 || !Number.isInteger(col)) {
          errors.push(`Line ${lineNum}: invalid seat_col "${seatColStr}"`);
          continue;
        }
        try {
          await db.addStudent({
            name,
            seat_row: row,
            seat_col: col,
            computing_id: computingId
          });
          added++;
        } catch (err) {
          errors.push(`Line ${lineNum}: ${err.message}`);
        }
      }

      const summary = `<p class="bulk-summary">Added ${added} student${added === 1 ? '' : 's'}.</p>`;
      const errList = errors.length
        ? `<ul class="errors">${errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`
        : '';
      resultEl.innerHTML = summary + errList;
      renderRoster();
    });

    // --- Seating chart + contribution modal ---

    let activeSessionIdForChart = null;
    let sessionContribCounts = new Map();
    let modalContext = null;
    let submitting = false;

    async function renderSeatingChart(session) {
      const area = document.getElementById('seating-area');
      if (!session) {
        activeSessionIdForChart = null;
        area.innerHTML = '';
        return;
      }
      activeSessionIdForChart = session.id;

      const students = await db.getAllStudents();
      if (students.length === 0) {
        area.innerHTML = '<p class="empty">No students yet. Add students in the Roster view first.</p>';
        return;
      }

      const contribs = await db.getContributionsBySession(session.id);
      sessionContribCounts = new Map();
      for (const c of contribs) {
        sessionContribCounts.set(c.student_id, (sessionContribCounts.get(c.student_id) || 0) + 1);
      }

      const maxRow = students.reduce((m, s) => Math.max(m, Number(s.seat_row) || 1), 1);
      const maxCol = students.reduce((m, s) => Math.max(m, Number(s.seat_col) || 1), 1);

      const tiles = students.map(s => {
        const count = sessionContribCounts.get(s.id) || 0;
        const has = count > 0 ? ' has-contrib' : '';
        const row = Number(s.seat_row) || 1;
        const col = Number(s.seat_col) || 1;
        return `
          <div class="seat-tile${has}" data-student-id="${s.id}" role="button" tabindex="0"
               style="grid-row: ${row}; grid-column: ${col};">
            <span class="seat-name">${escapeHtml(s.name)}</span>
            <span class="seat-badge"${count ? '' : ' hidden'}>${count}</span>
          </div>
        `;
      }).join('');

      area.innerHTML = `
        <div class="seating-grid" style="--cols: ${maxCol}; --rows: ${maxRow};">
          ${tiles}
        </div>
      `;
    }

    function updateTileBadge(studentId) {
      const tile = document.querySelector(`.seat-tile[data-student-id="${studentId}"]`);
      if (!tile) return;
      const count = sessionContribCounts.get(studentId) || 0;
      const badge = tile.querySelector('.seat-badge');
      if (count > 0) {
        badge.textContent = String(count);
        badge.hidden = false;
        tile.classList.add('has-contrib');
      } else {
        badge.hidden = true;
        tile.classList.remove('has-contrib');
      }
    }

    function openContributionModal(studentId, sessionId) {
      const tile = document.querySelector(`.seat-tile[data-student-id="${studentId}"]`);
      const name = tile?.querySelector('.seat-name')?.textContent || 'Student';
      modalContext = { studentId, sessionId };
      submitting = false;
      document.getElementById('modal-student-name').textContent = name;
      document.getElementById('modal-note').value = '';
      document.getElementById('modal-error').hidden = true;
      document.getElementById('contribution-modal').hidden = false;
    }

    function closeContributionModal() {
      document.getElementById('contribution-modal').hidden = true;
      modalContext = null;
      submitting = false;
    }

    // Delegated tap handler on the seating area
    document.getElementById('seating-area').addEventListener('pointerup', (e) => {
      const tile = e.target.closest('.seat-tile');
      if (!tile) return;
      if (!activeSessionIdForChart) return;
      openContributionModal(Number(tile.dataset.studentId), activeSessionIdForChart);
    });

    // Modal: handles backdrop, cancel, and quality buttons
    const modalEl = document.getElementById('contribution-modal');
    modalEl.addEventListener('pointerup', async (e) => {
      if (e.target === modalEl) { closeContributionModal(); return; }
      if (e.target.closest('[data-cancel]')) { closeContributionModal(); return; }

      const qualityBtn = e.target.closest('.quality-btn');
      if (!qualityBtn) return;
      if (!modalContext || submitting) return;

      submitting = true;
      const { studentId, sessionId } = modalContext;
      const quality = qualityBtn.dataset.quality;
      const note = document.getElementById('modal-note').value.trim();
      const errorEl = document.getElementById('modal-error');
      errorEl.hidden = true;

      try {
        await db.addContribution({
          student_id: studentId,
          session_id: sessionId,
          quality,
          note
        });
        sessionContribCounts.set(studentId, (sessionContribCounts.get(studentId) || 0) + 1);
        updateTileBadge(studentId);
        closeContributionModal();
      } catch (err) {
        errorEl.textContent = `Couldn't save: ${err.message}. Tap a quality button to retry.`;
        errorEl.hidden = false;
        submitting = false;
      }
    });

    // --- Review view ---

    let reviewSessionId = null;
    let editContribContext = null;
    let editSubmitting = false;
    let addContribContext = null;
    let addSubmitting = false;

    function formatTimeOfDay(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function qualityClass(quality) {
      if (quality === 'Substantive') return 'substantive';
      if (quality === 'Okay') return 'okay';
      if (quality === 'Just talking') return 'talking';
      return 'okay';
    }

    async function renderReview() {
      const sessions = await db.getAllSessions();
      sessions.sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.id - a.id;
      });

      const emptyEl = document.getElementById('review-empty');
      const toolbar = document.getElementById('review-toolbar');
      const content = document.getElementById('review-content');

      if (sessions.length === 0) {
        emptyEl.hidden = false;
        toolbar.hidden = true;
        content.hidden = true;
        reviewSessionId = null;
        return;
      }

      emptyEl.hidden = true;
      toolbar.hidden = false;
      content.hidden = false;

      const picker = document.getElementById('review-session-picker');
      picker.innerHTML = sessions.map(s => {
        const topic = (s.topic ?? '').trim() || 'Untitled session';
        return `<option value="${s.id}">${escapeHtml(formatSessionDate(s.date))} — ${escapeHtml(topic)}</option>`;
      }).join('');

      if (!reviewSessionId || !sessions.find(s => s.id === reviewSessionId)) {
        reviewSessionId = sessions[0].id;
      }
      picker.value = String(reviewSessionId);

      await renderSessionDetail(reviewSessionId);
    }

    async function renderSessionDetail(sessionId) {
      const session = await db.getSession(sessionId);
      if (!session) return;

      const students = await db.getAllStudents();
      students.sort((a, b) =>
        (Number(a.seat_row) - Number(b.seat_row)) ||
        (Number(a.seat_col) - Number(b.seat_col))
      );

      const contribs = await db.getContributionsBySession(sessionId);

      const byStudent = new Map();
      for (const c of contribs) {
        if (!byStudent.has(c.student_id)) byStudent.set(c.student_id, []);
        byStudent.get(c.student_id).push(c);
      }
      for (const arr of byStudent.values()) {
        arr.sort((a, b) =>
          (a.timestamp ?? '') < (b.timestamp ?? '') ? -1 :
          (a.timestamp ?? '') > (b.timestamp ?? '') ? 1 : 0
        );
      }

      const topic = (session.topic ?? '').trim() || 'Untitled session';
      document.getElementById('review-date').textContent = formatSessionDate(session.date);
      document.getElementById('review-topic').textContent = topic;

      const total = contribs.length;
      const uniq = byStudent.size;
      const statusHtml = session.status === 'active'
        ? '<span class="status-active">Active</span>'
        : '';
      document.getElementById('review-stats').innerHTML =
        `${total} contribution${total === 1 ? '' : 's'} · ${uniq} student${uniq === 1 ? '' : 's'} contributed${statusHtml}`;

      const listEl = document.getElementById('review-student-list');

      if (students.length === 0) {
        listEl.innerHTML = '<p class="empty">No students yet. Add students in the Roster view first.</p>';
        return;
      }

      listEl.innerHTML = students.map(s => {
        const studentContribs = byStudent.get(s.id) || [];
        if (studentContribs.length === 0) {
          return `
            <div class="student-block empty">
              <div class="student-name">${escapeHtml(s.name)}</div>
              <div class="no-contrib">No contributions this session</div>
            </div>
          `;
        }
        const rows = studentContribs.map(c => `
          <div class="contrib-row">
            <span class="contrib-time">${formatTimeOfDay(c.timestamp)}</span>
            <span class="quality-badge quality-${qualityClass(c.quality)}">${escapeHtml(c.quality)}</span>
            ${c.note ? `<span class="contrib-note">${escapeHtml(c.note)}</span>` : '<span class="contrib-note"></span>'}
            <span class="contrib-actions">
              <button type="button" class="link-btn" data-action="edit-contrib" data-id="${c.id}">Edit</button>
              <button type="button" class="link-btn danger" data-action="delete-contrib" data-id="${c.id}">Delete</button>
            </span>
          </div>
        `).join('');
        return `
          <div class="student-block">
            <div class="student-name">${escapeHtml(s.name)}<span class="contrib-count">(${studentContribs.length})</span></div>
            <div class="contrib-list">${rows}</div>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.id);
          if (btn.dataset.action === 'edit-contrib') openEditContribModal(id);
          else if (btn.dataset.action === 'delete-contrib') handleDeleteContrib(id);
        });
      });
    }

    document.getElementById('review-session-picker').addEventListener('change', (e) => {
      reviewSessionId = Number(e.target.value);
      renderSessionDetail(reviewSessionId);
    });

    // --- Edit contribution modal ---

    async function openEditContribModal(contribId) {
      const c = await db.getContribution(contribId);
      if (!c) return;
      const student = await db.getStudent(c.student_id);
      editContribContext = { id: contribId };
      editSubmitting = false;
      document.getElementById('edit-contrib-student').textContent = student?.name ?? 'Unknown student';
      document.getElementById('edit-contrib-note').value = c.note ?? '';
      document.getElementById('edit-contrib-error').hidden = true;
      document.getElementById('edit-contrib-modal').hidden = false;
    }

    function closeEditContribModal() {
      document.getElementById('edit-contrib-modal').hidden = true;
      editContribContext = null;
      editSubmitting = false;
    }

    document.getElementById('edit-contrib-modal').addEventListener('pointerup', async (e) => {
      const modalEl = document.getElementById('edit-contrib-modal');
      if (e.target === modalEl) { closeEditContribModal(); return; }
      if (e.target.closest('[data-cancel]')) { closeEditContribModal(); return; }

      const btn = e.target.closest('[data-edit-quality]');
      if (!btn) return;
      if (!editContribContext || editSubmitting) return;

      editSubmitting = true;
      const quality = btn.dataset.editQuality;
      const note = document.getElementById('edit-contrib-note').value.trim();
      const errorEl = document.getElementById('edit-contrib-error');
      errorEl.hidden = true;

      try {
        await db.updateContribution(editContribContext.id, { quality, note });
        closeEditContribModal();
        if (reviewSessionId) await renderSessionDetail(reviewSessionId);
      } catch (err) {
        errorEl.textContent = `Couldn't save: ${err.message}`;
        errorEl.hidden = false;
        editSubmitting = false;
      }
    });

    async function handleDeleteContrib(contribId) {
      const ok = confirm('Delete this contribution? This cannot be undone.');
      if (!ok) return;
      await db.deleteContribution(contribId);
      if (reviewSessionId) await renderSessionDetail(reviewSessionId);
    }

    // --- Add contribution modal ---

    async function openAddContribModal() {
      if (!reviewSessionId) return;
      const students = await db.getAllStudents();
      students.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      const select = document.getElementById('add-contrib-student');
      if (students.length === 0) {
        alert('No students in the roster yet. Add some from the Roster view first.');
        return;
      }
      select.innerHTML = students.map(s =>
        `<option value="${s.id}">${escapeHtml(s.name)}</option>`
      ).join('');
      document.getElementById('add-contrib-note').value = '';
      document.getElementById('add-contrib-error').hidden = true;
      addContribContext = { sessionId: reviewSessionId };
      addSubmitting = false;
      document.getElementById('add-contrib-modal').hidden = false;
    }

    function closeAddContribModal() {
      document.getElementById('add-contrib-modal').hidden = true;
      addContribContext = null;
      addSubmitting = false;
    }

    document.getElementById('btn-add-contrib').addEventListener('click', openAddContribModal);

    document.getElementById('add-contrib-modal').addEventListener('pointerup', async (e) => {
      const modalEl = document.getElementById('add-contrib-modal');
      if (e.target === modalEl) { closeAddContribModal(); return; }
      if (e.target.closest('[data-cancel]')) { closeAddContribModal(); return; }

      const btn = e.target.closest('[data-add-quality]');
      if (!btn) return;
      if (!addContribContext || addSubmitting) return;

      addSubmitting = true;
      const studentId = Number(document.getElementById('add-contrib-student').value);
      const quality = btn.dataset.addQuality;
      const note = document.getElementById('add-contrib-note').value.trim();
      const errorEl = document.getElementById('add-contrib-error');
      errorEl.hidden = true;

      if (!studentId) {
        errorEl.textContent = 'Please select a student.';
        errorEl.hidden = false;
        addSubmitting = false;
        return;
      }

      try {
        await db.addContribution({
          student_id: studentId,
          session_id: addContribContext.sessionId,
          quality,
          note
        });
        closeAddContribModal();
        if (reviewSessionId) await renderSessionDetail(reviewSessionId);
      } catch (err) {
        errorEl.textContent = `Couldn't save: ${err.message}`;
        errorEl.hidden = false;
        addSubmitting = false;
      }
    });

    renderRoster();
  </script>
</body>
</html>
